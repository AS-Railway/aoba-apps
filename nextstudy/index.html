<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>つぎなにやる？</title>
<style>
  :root {
    --bg: #f5f3ee; --surface: #fff; --surface-2: #eeebe4; --text: #1f2328; --muted: #5f646c; --line: #d6d1c6;
    --accent: #2e5fb3; --accent-soft: #e1e9f7; --on: #fff; --good: #1f6b45; --bad: #a8402a; --bad-soft: #f8e3dc; --goal: #6b6f76;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #121519; --surface: #1b1f25; --surface-2: #252a32; --text: #e9ebee; --muted: #a2a8b1; --line: #3a414c;
    --accent: #8db4ff; --accent-soft: #213049; --on: #0d1522; --good: #8fd3ad; --bad: #f0a48c; --bad-soft: #3d2620; --goal: #c3c8cf; } }
  :root[data-theme="dark"] {
    --bg: #121519; --surface: #1b1f25; --surface-2: #252a32; --text: #e9ebee; --muted: #a2a8b1; --line: #3a414c;
    --accent: #8db4ff; --accent-soft: #213049; --on: #0d1522; --good: #8fd3ad; --bad: #f0a48c; --bad-soft: #3d2620; --goal: #c3c8cf; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .num { font-variant-numeric: tabular-nums; }
  .app { max-width: 1180px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: center; gap: 10px; }
  header h1 { margin: 0; font-size: 20px; flex: 1; }
  .icon-btn { min-width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; }
  .grid { display: flex; flex-direction: column; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
  .card h2 { margin: 0 0 10px; font-size: 15px; color: var(--muted); font-weight: 600; }

  .pick { background: var(--accent-soft); border: 2px solid var(--accent); text-align: center; }
  .pick .label { font-size: 13px; color: var(--accent); font-weight: 700; letter-spacing: .1em; }
  .pick .name { font-size: clamp(40px, 9vh, 72px); font-weight: 800; line-height: 1.15; margin: 4px 0; overflow-wrap: anywhere; }
  .pick .why { color: var(--muted); font-size: 14px; min-height: 2.6em; }
  .other { min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 16px; margin-top: 6px; }
  .rec { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .rec button { min-height: 60px; border-radius: 16px; border: 0; background: var(--accent); color: var(--on); font-weight: 800; font-size: 18px; }
  .rec button small { display: block; font-size: 11px; font-weight: 500; }
  .rec button:disabled { opacity: .4; cursor: not-allowed; }
  .todaylist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
  .todaylist li { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 12px; padding: 0 4px 0 12px; min-height: 44px; }
  .todaylist li span { flex: 1; }
  .todaylist button { width: 44px; height: 44px; border: 0; background: none; color: var(--muted); font-size: 18px; border-radius: 10px; }
  .empty { color: var(--muted); font-size: 14px; padding: 12px; border: 1px dashed var(--line); border-radius: 12px; }

  .bal { display: flex; flex-direction: column; gap: 8px; }
  .bal .r { display: grid; grid-template-columns: minmax(4.5em, 7em) 1fr auto; align-items: center; gap: 10px; min-height: 44px; border-radius: 12px; padding: 0 8px; border: 0; background: none; text-align: left; width: 100%; }
  .bal .r:hover { background: var(--surface-2); }
  .bal .r.sel { background: var(--accent-soft); }
  .bal .n { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bal .track { position: relative; height: 16px; background: var(--surface-2); border-radius: 99px; overflow: visible; }
  .bal .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 99px; }
  .bal .goal { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--goal); border-radius: 2px; }
  .bal .v { font-size: 13px; color: var(--muted); text-align: right; min-width: 6.5em; }
  .bal .v b { color: var(--text); }
  .bal .v .low { color: var(--bad); font-weight: 700; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; background: var(--accent); vertical-align: middle; margin-right: 4px; }
  .legend i.g { width: 3px; height: 14px; background: var(--goal); }

  dialog { border: 1px solid var(--line); border-radius: 20px; background: var(--surface); color: var(--text); padding: 18px; width: min(94vw, 480px); max-height: 90dvh; }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h3 { margin: 0 0 4px; }
  dialog p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .subjrow { display: grid; grid-template-columns: 1fr auto auto auto auto; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .subjrow .w { min-width: 2.2em; text-align: center; font-weight: 700; }
  .subjrow button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 20px; }
  .subjrow .del { border: 0; background: none; color: var(--muted); }
  .subjrow .del.armed { width: auto; padding: 0 10px; color: var(--bad); background: var(--bad-soft); font-size: 13px; font-weight: 700; }
  form.add { display: flex; gap: 8px; margin-top: 12px; }
  form.add input { flex: 1; min-width: 0; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; font-size: 16px; }
  .btn { min-height: 48px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--accent); color: var(--on); font-weight: 700; }
  .close { width: 100%; margin-top: 14px; }

  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; visibility: hidden; background: var(--text); color: var(--bg); padding: 8px 8px 8px 16px; border-radius: 14px; display: flex; gap: 8px; align-items: center; max-width: calc(100% - 32px); width: max-content; transition: all .25s; z-index: 20; }
  .toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }
  .toast button { background: none; border: 0; color: var(--bg); font-weight: 800; text-decoration: underline; min-height: 40px; padding: 0 8px; }

  @media (min-width: 900px) and (orientation: landscape) {
    .app { height: 100vh; height: 100dvh; padding: 18px 24px; }
    .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .col .card.grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .col .card.grow .scroll { flex: 1; min-height: 0; overflow-y: auto; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>つぎなにやる？</h1>
    <button class="icon-btn" id="setBtn" type="button">⚙ 科目</button>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="ライト・ダークを切り替え">◐</button>
  </header>
  <div class="grid">
    <div class="col">
      <section class="card pick" aria-live="polite">
        <div class="label">つぎはこれ</div>
        <div class="name" id="pickName">-</div>
        <div class="why" id="pickWhy"></div>
        <button class="other" type="button" id="otherBtn">ほかの案</button>
        <div class="rec" id="recBtns">
          <button type="button" data-m="15">15分<small>やった</small></button>
          <button type="button" data-m="30">30分<small>やった</small></button>
          <button type="button" data-m="60">60分<small>やった</small></button>
        </div>
      </section>
      <section class="card grow" aria-labelledby="h-today">
        <h2 id="h-today">今日の記録 <span class="num" id="todaySum"></span></h2>
        <div class="scroll"><ul class="todaylist" id="todayList"></ul></div>
      </section>
    </div>
    <div class="col">
      <section class="card grow" aria-labelledby="h-bal">
        <h2 id="h-bal">今週のバランス（月曜から）</h2>
        <div class="scroll"><div class="bal" id="bal"></div></div>
        <div class="legend"><span><i></i>実際の割合</span><span><i class="g"></i>目標の割合</span><span>行をタップすると、その科目を記録できます</span></div>
      </section>
    </div>
  </div>
</div>

<dialog id="setDlg" aria-labelledby="setTitle">
  <h3 id="setTitle">科目と重み</h3>
  <p>重みが大きい科目ほど、多くの時間を目標にします（1〜5）。</p>
  <div id="subjList"></div>
  <form class="add" id="addForm">
    <label class="sr" for="addName">科目名</label>
    <input id="addName" placeholder="例：理科" maxlength="12" autocomplete="off" enterkeyhint="done">
    <button class="btn">追加</button>
  </form>
  <button class="btn close" type="button" id="closeDlg">閉じる</button>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button type="button" id="toastBtn" hidden></button></div>

<script>
(() => {
  const KEY = 'nextstudy-v2';
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const toDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const diffDays = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000);
  const today = () => fmt(new Date());
  const weekStart = () => { const d = new Date(); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return fmt(d); };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const fresh = () => ({ subjects: [{ id: 's1', name: '数学', w: 3 }, { id: 's2', name: '英語', w: 2 }, { id: 's3', name: '国語', w: 1 }], logs: [], theme: null });

  let db;
  try { db = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY)) || {}); }
  catch (e) { try { localStorage.setItem(KEY + '-broken-' + Date.now(), localStorage.getItem(KEY)); } catch (_) {} db = fresh(); }
  let warned = false;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); warned = false; } catch (e) { if (!warned) { toast('保存できませんでした'); warned = true; } } };

  let toastT;
  function toast(msg, label, fn) {
    $('toastMsg').textContent = msg; const b = $('toastBtn'); b.hidden = !label;
    if (label) { b.textContent = label; b.onclick = () => { fn(); $('toast').classList.remove('show'); }; }
    $('toast').classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('show'), label ? 5000 : 2400);
  }

  // ---------- 提案のスコア ----------
  // 今週の「目標の割合 − 実際の割合」と、最後にやってからの日数で点数をつける
  function stats() {
    const ws = weekStart(), t = today(), ids = new Set(db.subjects.map(s => s.id));
    const wl = db.logs.filter(l => l.date >= ws && ids.has(l.sid));
    const total = wl.reduce((a, l) => a + l.min, 0), wsum = db.subjects.reduce((a, s) => a + s.w, 0) || 1;
    return db.subjects.map(s => {
      const mine = wl.filter(l => l.sid === s.id).reduce((a, l) => a + l.min, 0);
      const goal = s.w / wsum, real = total ? mine / total : 0;
      const last = db.logs.filter(l => l.sid === s.id).map(l => l.date).sort().pop();
      const days = last ? diffDays(last, t) : null;
      const score = (goal - real) * 10 + Math.min(days == null ? 7 : days, 7) * .8;
      return { s, mine, goal, real, days, score };
    }).sort((a, b) => b.score - a.score);
  }
  let ranking = [], idx = 0, chosen = null; // chosen: バランス表から選んだ科目
  function refreshPick(keep) {
    ranking = stats();
    if (!keep) { idx = 0; chosen = null; }
    idx = Math.min(idx, Math.max(0, ranking.length - 1));
    renderPick();
  }
  function current() { return chosen ? ranking.find(r => r.s.id === chosen) : ranking[idx]; }
  function renderPick() {
    const p = current();
    $('pickName').textContent = p ? p.s.name : '科目がありません';
    $('otherBtn').hidden = ranking.length < 2;
    $('otherBtn').textContent = chosen ? 'おすすめに戻す' : `ほかの案（${idx + 1} / ${ranking.length}）`;
    document.querySelectorAll('[data-m]').forEach(b => b.disabled = !p);
    if (!p) { $('pickWhy').textContent = '⚙ 科目 から追加してください'; return; }
    const lastTxt = p.days == null ? 'まだ記録なし' : p.days === 0 ? '今日もやった' : `最後にやってから${p.days}日`;
    $('pickWhy').textContent = chosen ? `自分で選んだ科目です。今週 ${p.mine}分` : `${lastTxt}・今週の割合 ${Math.round(p.real * 100)}%（目標 ${Math.round(p.goal * 100)}%）`;
  }
  $('otherBtn').onclick = () => { if (chosen) chosen = null; else idx = (idx + 1) % ranking.length; renderPick(); renderBal(); };

  // ---------- 記録 ----------
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    const p = current(); if (!p) return;
    const log = { id: uid(), sid: p.s.id, name: p.s.name, min: +b.dataset.m, date: today(), at: Date.now() };
    db.logs.push(log); save();
    refreshPick(); renderAll(true);
    toast(`${p.s.name} ${log.min}分 を記録しました`, '取り消す', () => { db.logs = db.logs.filter(l => l.id !== log.id); save(); refreshPick(); renderAll(true); });
  });
  function renderToday() {
    const t = today(), list = db.logs.filter(l => l.date === t).sort((a, b) => b.at - a.at), ul = $('todayList');
    $('todaySum').textContent = list.length ? `合計 ${list.reduce((a, l) => a + l.min, 0)}分` : '';
    ul.innerHTML = '';
    if (!list.length) { ul.innerHTML = '<li class="empty" style="border-radius:12px">まだ記録がありません。上のおすすめで始めてみましょう。</li>'; return; }
    list.forEach(l => {
      const li = document.createElement('li');
      const time = new Date(l.at); li.innerHTML = `<span></span><button type="button">×</button>`;
      li.querySelector('span').textContent = `${time.getHours()}:${pad(time.getMinutes())}　${l.name}　${l.min}分`;
      const b = li.querySelector('button'); b.setAttribute('aria-label', `${l.name} ${l.min}分の記録を削除`);
      b.onclick = () => { db.logs = db.logs.filter(x => x.id !== l.id); save(); refreshPick(true); renderAll(true); toast('記録を削除しました', '元に戻す', () => { db.logs.push(l); save(); refreshPick(true); renderAll(true); }); };
      ul.appendChild(li);
    });
  }
  function renderBal() {
    const box = $('bal'); box.innerHTML = '';
    if (!ranking.length) { box.innerHTML = '<div class="empty">科目がありません。⚙ 科目 から追加してください。</div>'; return; }
    const cur = current();
    [...ranking].sort((a, b) => b.s.w - a.s.w || a.s.name.localeCompare(b.s.name)).forEach(r => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'r' + (cur && cur.s.id === r.s.id ? ' sel' : '');
      const low = r.real + .1 < r.goal;
      b.innerHTML = `<span class="n"></span><span class="track"><span class="fill" style="width:${r.real * 100}%"></span><span class="goal" style="left:calc(${r.goal * 100}% - 1px)"></span></span>
        <span class="v"><b class="num">${Math.round(r.real * 100)}%</b> / ${Math.round(r.goal * 100)}%${low ? ' <span class="low">不足</span>' : ''}<br>${r.mine}分</span>`;
      b.querySelector('.n').textContent = r.s.name;
      b.setAttribute('aria-label', `${r.s.name}：実際${Math.round(r.real * 100)}%、目標${Math.round(r.goal * 100)}%、今週${r.mine}分。タップで選ぶ`);
      b.onclick = () => { chosen = r.s.id; renderPick(); renderBal(); };
      box.appendChild(b);
    });
  }
  function renderAll(skipPick) { if (!skipPick) refreshPick(true); renderToday(); renderBal(); }

  // ---------- 科目の設定 ----------
  function renderSubj() {
    const box = $('subjList'); box.innerHTML = '';
    db.subjects.forEach((s, i) => {
      const row = document.createElement('div'); row.className = 'subjrow';
      row.innerHTML = `<span class="nm"></span><button type="button" aria-label="重みを下げる">−</button><span class="w num">${s.w}</span><button type="button" aria-label="重みを上げる">＋</button><button type="button" class="del" aria-label="${s.name}を削除">🗑</button>`;
      row.querySelector('.nm').textContent = s.name;
      const [minus, plus, del] = row.querySelectorAll('button');
      minus.disabled = s.w <= 1; plus.disabled = s.w >= 5;
      minus.onclick = () => { s.w--; save(); renderSubj(); refreshPick(); renderAll(true); };
      plus.onclick = () => { s.w++; save(); renderSubj(); refreshPick(); renderAll(true); };
      del.onclick = () => {
        if (!del.classList.contains('armed')) { del.classList.add('armed'); del.textContent = '削除する'; setTimeout(() => { if (del.isConnected) { del.classList.remove('armed'); del.textContent = '🗑'; } }, 3000); return; }
        db.subjects.splice(i, 1); save(); renderSubj(); refreshPick(); renderAll(true);
        toast(`「${s.name}」を削除しました（記録は残ります）`, '元に戻す', () => { db.subjects.splice(i, 0, s); save(); renderSubj(); refreshPick(); renderAll(true); });
      };
      box.appendChild(row);
    });
    if (!db.subjects.length) box.innerHTML = '<div class="empty">科目を追加してください。</div>';
  }
  $('addForm').onsubmit = e => {
    e.preventDefault();
    const v = $('addName').value.trim(); if (!v) return;
    if (db.subjects.some(s => s.name === v)) { toast('同じ名前の科目があります'); return; }
    db.subjects.push({ id: uid(), name: v, w: 2 }); $('addName').value = ''; save(); renderSubj(); refreshPick(); renderAll(true); $('addName').focus();
  };
  $('setBtn').onclick = () => { renderSubj(); $('setDlg').showModal(); };
  $('closeDlg').onclick = () => $('setDlg').close();

  const applyTheme = () => { if (db.theme) document.documentElement.dataset.theme = db.theme; else delete document.documentElement.dataset.theme; };
  $('themeBtn').onclick = () => { const dark = db.theme ? db.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; db.theme = dark ? 'light' : 'dark'; applyTheme(); save(); };

  applyTheme(); refreshPick(); renderAll(true); // 開いた時点でおすすめを表示
  let shown = today();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== shown) { shown = today(); refreshPick(); renderAll(true); } });
})();
</script>
</body>
</html>
