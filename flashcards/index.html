<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>おぼえる箱</title>
<style>
  :root {
    --bg: #f5f3ee; --surface: #fff; --surface-2: #eeebe4; --text: #1f2328; --muted: #5f646c; --line: #dfdbd2;
    --accent: #2e5fb3; --accent-soft: #e1e9f7; --on: #fff; --good: #1f7a4d; --good-soft: #dcefe4; --bad: #b0432b; --bad-soft: #f8e3dc;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #121519; --surface: #1b1f25; --surface-2: #252a32; --text: #e9ebee; --muted: #a2a8b1; --line: #313741;
    --accent: #8db4ff; --accent-soft: #213049; --on: #0d1522; --good: #8fd3ad; --good-soft: #1f382c; --bad: #f0a48c; --bad-soft: #3d2620; } }
  :root[data-theme="dark"] {
    --bg: #121519; --surface: #1b1f25; --surface-2: #252a32; --text: #e9ebee; --muted: #a2a8b1; --line: #313741;
    --accent: #8db4ff; --accent-soft: #213049; --on: #0d1522; --good: #8fd3ad; --good-soft: #1f382c; --bad: #f0a48c; --bad-soft: #3d2620; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .num { font-variant-numeric: tabular-nums; }
  .app { max-width: 1180px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: center; gap: 10px; }
  header h1 { margin: 0; font-size: 20px; flex: 1; }
  .icon-btn { min-width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; }
  .grid { display: flex; flex-direction: column; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
  .card h2 { margin: 0 0 10px; font-size: 15px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card h2 .r { margin-left: auto; font-weight: 400; }

  .decks { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .chip { flex: none; min-height: 44px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface); }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
  .chip small { color: var(--muted); margin-left: 4px; }
  .chip.badge small { color: var(--bad); font-weight: 700; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stats div { background: var(--surface-2); border-radius: 12px; padding: 6px 10px; }
  .stats span { display: block; font-size: 12px; color: var(--muted); }
  .stats b { font-size: 20px; }

  .flash { position: relative; flex: 1; min-height: 200px; border-radius: 20px; border: 2px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; cursor: pointer; width: 100%; }
  .flash.back { border-color: var(--accent); background: var(--accent-soft); }
  .flash .side { position: absolute; top: 10px; left: 14px; font-size: 12px; color: var(--muted); }
  .flash .txt { font-size: clamp(24px, 5vh, 44px); font-weight: 700; overflow-wrap: anywhere; max-height: 100%; overflow: auto; }
  .flash .sub { font-size: 16px; color: var(--muted); margin-top: 10px; overflow-wrap: anywhere; }
  .flash .tap { position: absolute; bottom: 10px; font-size: 13px; color: var(--muted); }
  .judge { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .judge button { min-height: 64px; border-radius: 18px; border: 0; font-size: 19px; font-weight: 800; }
  .judge .ng { background: var(--bad-soft); color: var(--bad); }
  .judge .ok { background: var(--good); color: var(--on); }
  .judge button:disabled { opacity: .35; cursor: not-allowed; }
  .undo { background: none; border: 0; color: var(--accent); min-height: 44px; font-size: 14px; }
  .donebox { text-align: center; }
  .donebox b { font-size: 26px; display: block; }

  form.add { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
  input, textarea { border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; font-size: 16px; min-width: 0; }
  input { height: 48px; }
  textarea { width: 100%; height: 84px; padding: 10px 12px; resize: vertical; }
  .btn { min-height: 48px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--accent); color: var(--on); font-weight: 700; }
  .btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  details summary { min-height: 44px; display: flex; align-items: center; color: var(--accent); cursor: pointer; font-size: 14px; }
  .hint { font-size: 12px; color: var(--muted); margin: 6px 0; }
  .list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
  .list li { display: grid; grid-template-columns: 1fr 1fr auto auto; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 12px; padding: 4px 4px 4px 12px; font-size: 14px; }
  .list li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list li .box { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .list li button { width: 40px; height: 40px; border: 0; background: none; color: var(--muted); border-radius: 10px; font-size: 16px; }
  .list li.edit { grid-template-columns: 1fr 1fr auto; padding: 6px; }
  .list li.edit input { height: 40px; }
  .empty { color: var(--muted); font-size: 14px; padding: 12px; border: 1px dashed var(--line); border-radius: 12px; }
  .deckbar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .deckbar .link { background: none; border: 0; color: var(--accent); min-height: 40px; font-size: 13px; padding: 0 6px; }
  .deckbar .link.danger { color: var(--bad); }
  .deckbar form { display: flex; gap: 6px; width: 100%; }
  .deckbar form input { flex: 1; height: 44px; }

  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; visibility: hidden; background: var(--text); color: var(--bg); padding: 8px 8px 8px 16px; border-radius: 14px; display: flex; gap: 8px; align-items: center; max-width: calc(100% - 32px); width: max-content; transition: all .25s; z-index: 20; }
  .toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }
  .toast button { background: none; border: 0; color: var(--bg); font-weight: 800; text-decoration: underline; min-height: 40px; padding: 0 8px; }

  @media (min-width: 900px) and (orientation: landscape) {
    .app { height: 100vh; height: 100dvh; padding: 18px 24px; }
    .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; }
    .col.left .flash { min-height: 0; }
    .col.right .card.grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .col.right .scroll { flex: 1; min-height: 0; overflow-y: auto; }
  }
  @media not ((min-width: 900px) and (orientation: landscape)) { .flash { min-height: 260px; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>おぼえる箱</h1>
    <button class="icon-btn" id="exportBtn" type="button" title="バックアップを保存">⤓</button>
    <button class="icon-btn" id="importBtn" type="button" title="バックアップから戻す">⤒</button>
    <input type="file" id="importFile" accept="application/json" hidden>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="ライト・ダークを切り替え">◐</button>
  </header>
  <div class="decks" id="decks" role="group" aria-label="デッキ"></div>
  <div class="grid">
    <div class="col left">
      <div class="stats">
        <div><span>今日の残り</span><b class="num" id="sDue">0</b></div>
        <div><span>覚えた（箱5以上）</span><b class="num" id="sKnown">0</b></div>
        <div><span>連続</span><b class="num" id="sStreak">0日</b></div>
      </div>
      <button class="flash" id="flash" type="button" aria-live="polite"></button>
      <div class="judge" id="judge">
        <button class="ng" type="button" id="ngBtn" disabled>✕ 忘れた<br><small>キー 1</small></button>
        <button class="ok" type="button" id="okBtn" disabled>◯ 覚えてた<br><small>キー 2</small></button>
      </div>
      <button class="undo" type="button" id="undoBtn" hidden>↶ いまの判定を取り消す</button>
    </div>
    <div class="col right">
      <section class="card" aria-labelledby="h-add">
        <h2 id="h-add">カードを追加</h2>
        <form class="add" id="addForm">
          <label class="sr" for="fFront">表</label><input id="fFront" placeholder="表（例：apple）" autocomplete="off" enterkeyhint="next" maxlength="200">
          <label class="sr" for="fBack">裏</label><input id="fBack" placeholder="裏（例：りんご）" autocomplete="off" enterkeyhint="done" maxlength="400">
          <button class="btn">追加</button>
        </form>
        <details>
          <summary>まとめて追加（コピー＆貼り付け）</summary>
          <p class="hint">1行に1枚。「表,裏」または「表[Tab]裏」。最初の区切りで分けるので、裏にカンマが入ってもOK。</p>
          <label class="sr" for="bulk">まとめて追加</label>
          <textarea id="bulk" placeholder="apple,りんご&#10;dog,犬"></textarea>
          <button class="btn ghost" type="button" id="bulkBtn" style="margin-top:6px">まとめて追加</button>
        </details>
      </section>
      <section class="card grow" aria-labelledby="h-list">
        <h2 id="h-list">このデッキのカード <span class="r num" id="listCount"></span></h2>
        <div class="scroll"><ul class="list" id="list"></ul></div>
        <div class="deckbar" id="deckbar"></div>
      </section>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button type="button" id="toastBtn" hidden></button></div>

<script>
(() => {
  const KEY = 'flashcards-v2';
  const GAPS = [0, 1, 2, 4, 7, 15, 30]; // 箱の番号ごとの、次に出るまでの日数
  const NEW_PER_DAY = 20;
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => fmt(new Date());
  const shiftKey = (k, n) => { const [y, m, d] = k.split('-').map(Number); return fmt(new Date(y, m - 1, d + n)); };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const fresh = () => ({ decks: [{ id: 'd1', name: '英単語', cards: [] }], cur: 'd1', days: [], newCount: {}, theme: null });

  let db;
  try {
    const raw = localStorage.getItem(KEY);
    db = raw ? Object.assign(fresh(), JSON.parse(raw)) : fresh();
    if (!Array.isArray(db.decks) || !db.decks.length) throw 0;
  } catch (e) { try { localStorage.setItem(KEY + '-broken-' + Date.now(), localStorage.getItem(KEY)); } catch (_) {} db = fresh(); }
  let warned = false;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); warned = false; } catch (e) { if (!warned) { toast('保存できませんでした（容量不足など）'); warned = true; } } };
  let toastT;
  function toast(msg, label, fn) {
    $('toastMsg').textContent = msg; const b = $('toastBtn'); b.hidden = !label;
    if (label) { b.textContent = label; b.onclick = () => { fn(); $('toast').classList.remove('show'); }; }
    $('toast').classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('show'), label ? 5000 : 2400);
  }
  const deck = () => db.decks.find(d => d.id === db.cur) || db.decks[0];

  // ---------- 出題 ----------
  let queue = [], cur = null, flipped = false, lastUndo = null;
  function dueOf(d) {
    const t = today(), used = (db.newCount[t] || {})[d.id] || 0;
    const due = d.cards.filter(c => c.box > 0 && c.due <= t);
    const fresh = d.cards.filter(c => c.box === 0).slice(0, Math.max(0, NEW_PER_DAY - used)); // 新しいカードは1日20枚まで
    return due.concat(fresh);
  }
  function buildQueue() {
    queue = dueOf(deck()).map(c => c.id);
    for (let i = queue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
    nextCard();
  }
  function nextCard() {
    const d = deck();
    cur = null; flipped = false;
    while (queue.length && !cur) { const id = queue.shift(); cur = d.cards.find(c => c.id === id) || null; }
    render();
  }
  function judge(ok) {
    if (!cur || !flipped) return;
    const d = deck(), t = today(), before = { ...cur }, q = queue.slice(), wasNew = cur.box === 0, retry = !!cur.retry;
    lastUndo = { id: cur.id, before, queue: q, days: db.days.slice(), newCount: JSON.stringify(db.newCount) };
    if (wasNew) { db.newCount[t] = db.newCount[t] || {}; db.newCount[t][d.id] = (db.newCount[t][d.id] || 0) + 1; }
    if (ok) {
      if (!retry) cur.box = wasNew ? 2 : Math.min(6, cur.box + 1); // 初見で覚えていたら1段飛ばす
      cur.due = shiftKey(t, GAPS[cur.box]); delete cur.retry;
    } else {
      cur.box = 1; cur.due = shiftKey(t, 1); cur.retry = true;
      // 忘れたカードは、このあと数枚あとにもう一度出す
      queue.splice(Math.min(queue.length, 3), 0, cur.id);
    }
    if (!db.days.includes(t)) db.days.push(t);
    save(); nextCard(); $('undoBtn').hidden = false;
  }
  $('undoBtn').onclick = () => {
    if (!lastUndo) return;
    const c = deck().cards.find(x => x.id === lastUndo.id); if (!c) return;
    Object.keys(c).forEach(k => delete c[k]); Object.assign(c, lastUndo.before);
    queue = lastUndo.queue; db.days = lastUndo.days; db.newCount = JSON.parse(lastUndo.newCount);
    save(); cur = c; flipped = true; lastUndo = null; $('undoBtn').hidden = true; render();
  };
  const flip = () => { if (!cur) return; flipped = !flipped; render(); };
  $('flash').onclick = flip;
  $('okBtn').onclick = () => judge(true);
  $('ngBtn').onclick = () => judge(false);
  document.addEventListener('keydown', e => {
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    if (e.key === ' ' || e.key === 'Enter') { if (document.activeElement === $('flash') || document.activeElement === document.body) { e.preventDefault(); flip(); } }
    if (e.key === '1' || e.key === 'ArrowLeft') judge(false);
    if (e.key === '2' || e.key === 'ArrowRight') judge(true);
  });

  // ---------- 描画 ----------
  const esc = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  function render() {
    const d = deck(), t = today();
    // デッキ
    const dk = $('decks'); dk.innerHTML = '';
    db.decks.forEach(x => {
      const n = dueOf(x).length, b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (n ? ' badge' : '');
      b.innerHTML = `${esc(x.name)}<small>${n ? n + '枚' : '✓'}</small>`; b.setAttribute('aria-pressed', x.id === d.id);
      b.onclick = () => { if (x.id === db.cur) return; db.cur = x.id; save(); lastUndo = null; $('undoBtn').hidden = true; buildQueue(); };
      dk.appendChild(b);
    });
    const nb = document.createElement('button'); nb.type = 'button'; nb.className = 'chip'; nb.textContent = '＋ デッキ'; nb.onclick = () => deckForm('new'); dk.appendChild(nb);
    // 数字
    $('sDue').textContent = (cur ? 1 : 0) + new Set(queue).size;
    $('sKnown').textContent = `${d.cards.filter(c => c.box >= 5).length} / ${d.cards.length}`;
    let k = t; if (!db.days.includes(k)) k = shiftKey(k, -1);
    let n = 0; while (db.days.includes(k)) { n++; k = shiftKey(k, -1); }
    $('sStreak').textContent = n + '日';
    // カード
    const f = $('flash');
    f.classList.toggle('back', flipped && !!cur);
    if (cur) {
      f.innerHTML = `<span class="side">${flipped ? '裏' : '表'}${cur.box === 0 ? '・NEW' : cur.retry ? '・もう一度' : `・箱${cur.box}`}</span><span class="txt"></span>${flipped ? '<span class="sub"></span>' : ''}<span class="tap">${flipped ? '覚えていたか判定してください' : 'タップ（スペース）でめくる'}</span>`;
      f.querySelector('.txt').textContent = flipped ? cur.back : cur.front;
      if (flipped) f.querySelector('.sub').textContent = cur.front;
      f.setAttribute('aria-label', flipped ? `裏：${cur.back}` : `表：${cur.front}。タップでめくる`);
    } else {
      const nextDue = d.cards.filter(c => c.box > 0).map(c => c.due).sort()[0];
      f.innerHTML = d.cards.length
        ? `<div class="donebox"><b>今日の復習は完了！ 🎉</b><span>${nextDue ? `次は ${nextDue.slice(5).replace('-', '/')} に出てきます` : ''}</span></div>`
        : '<div class="donebox"><b>カードがありません</b><span>右の「カードを追加」から作りましょう</span></div>';
      f.removeAttribute('aria-label');
    }
    $('okBtn').disabled = $('ngBtn').disabled = !(cur && flipped);
    renderList();
  }
  let editId = null;
  function renderList() {
    const d = deck(), ul = $('list'); ul.innerHTML = '';
    $('listCount').textContent = `${d.cards.length}枚`;
    if (!d.cards.length) ul.innerHTML = '<li class="empty" style="display:block">まだカードがありません。</li>';
    [...d.cards].reverse().forEach(c => {
      const li = document.createElement('li');
      if (c.id === editId) {
        li.className = 'edit';
        li.innerHTML = `<input aria-label="表" maxlength="200"><input aria-label="裏" maxlength="400"><button class="btn" type="button" style="width:auto">保存</button>`;
        const [a, b] = li.querySelectorAll('input'); a.value = c.front; b.value = c.back;
        const ok = () => { if (a.value.trim() && b.value.trim()) { c.front = a.value.trim(); c.back = b.value.trim(); save(); } editId = null; render(); };
        li.querySelector('button').onclick = ok;
        [a, b].forEach(x => x.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) ok(); if (e.key === 'Escape') { editId = null; render(); } });
        setTimeout(() => a.focus(), 0);
      } else {
        li.innerHTML = `<span></span><span></span><span class="box">${c.box ? '箱' + c.box : 'NEW'}</span><span style="display:flex"><button type="button" aria-label="編集">✎</button><button type="button" aria-label="削除">🗑</button></span>`;
        li.children[0].textContent = c.front; li.children[1].textContent = c.back;
        const [eb, db2] = li.querySelectorAll('button');
        eb.onclick = () => { editId = c.id; renderList(); };
        db2.onclick = () => {
          const i = d.cards.indexOf(c); d.cards.splice(i, 1); queue = queue.filter(x => x !== c.id); if (cur && cur.id === c.id) nextCard(); save(); render();
          toast(`「${c.front}」を削除しました`, '元に戻す', () => { d.cards.splice(i, 0, c); save(); render(); });
        };
      }
      ul.appendChild(li);
    });
    // デッキの操作
    const bar = $('deckbar');
    if (!bar.querySelector('form')) {
      bar.innerHTML = `<button class="link" type="button" id="renameDeck">デッキ名を変更</button><button class="link danger" type="button" id="deleteDeck">このデッキを削除</button>`;
      $('renameDeck').onclick = () => deckForm('rename');
      $('deleteDeck').onclick = () => {
        if (db.decks.length <= 1) { toast('デッキは1つ以上必要です'); return; }
        const d0 = deck(), i = db.decks.indexOf(d0); db.decks.splice(i, 1); db.cur = db.decks[0].id; save(); buildQueue();
        toast(`「${d0.name}」（${d0.cards.length}枚）を削除しました`, '元に戻す', () => { db.decks.splice(i, 0, d0); db.cur = d0.id; save(); buildQueue(); });
      };
    }
  }
  function deckForm(mode) {
    const bar = $('deckbar');
    bar.innerHTML = `<form><label class="sr" for="deckName">デッキ名</label><input id="deckName" maxlength="20" placeholder="${mode === 'new' ? '新しいデッキの名前（例：古文単語）' : ''}" autocomplete="off"><button class="btn">${mode === 'new' ? '作成' : '変更'}</button><button class="btn ghost" type="button">やめる</button></form>`;
    const inp = $('deckName'); if (mode === 'rename') inp.value = deck().name; inp.focus(); inp.select();
    bar.querySelector('.ghost').onclick = () => { bar.innerHTML = ''; render(); };
    bar.querySelector('form').onsubmit = e => {
      e.preventDefault(); const v = inp.value.trim(); if (!v) return;
      if (mode === 'new') { const id = 'd' + uid(); db.decks.push({ id, name: v, cards: [] }); db.cur = id; toast(`デッキ「${v}」を作りました`); setTimeout(() => $('fFront').focus(), 0); }
      else deck().name = v;
      save(); bar.innerHTML = ''; buildQueue();
    };
  }

  // ---------- 追加 ----------
  function addCard(front, back) { deck().cards.push({ id: uid(), front, back, box: 0, due: today() }); }
  $('fFront').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); $('fBack').focus(); } });
  $('addForm').onsubmit = e => {
    e.preventDefault();
    const f = $('fFront').value.trim(), b = $('fBack').value.trim();
    if (!f) { $('fFront').focus(); return; }
    if (!b) { $('fBack').focus(); return; }
    addCard(f, b); save(); $('fFront').value = ''; $('fBack').value = ''; $('fFront').focus();
    queue.push(deck().cards[deck().cards.length - 1].id); if (!cur) nextCard(); else render();
    toast(`「${f}」を追加しました`);
  };
  $('fBack').addEventListener('keydown', e => { if (e.key === 'Enter' && e.isComposing) e.preventDefault(); });
  $('bulkBtn').onclick = () => {
    let ok = 0, skip = 0;
    $('bulk').value.split(/\r?\n/).forEach(line => {
      if (!line.trim()) return;
      const m = line.match(/^(.*?)(\t|,|，)(.*)$/); // 最初の区切りだけで分ける
      if (m && m[1].trim() && m[3].trim()) { addCard(m[1].trim(), m[3].trim()); ok++; } else skip++;
    });
    if (!ok && !skip) return;
    save(); $('bulk').value = ''; buildQueue();
    toast(`${ok}枚追加しました${skip ? `（${skip}行は区切りがなくスキップ）` : ''}`);
  };

  // ---------- バックアップ ----------
  $('exportBtn').onclick = () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' }));
    a.download = `oboeru-${today()}.json`; a.click(); URL.revokeObjectURL(a.href); toast('バックアップを保存しました');
  };
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const d = JSON.parse(await f.text()); if (!Array.isArray(d.decks) || !d.decks.length) throw 0;
      const backup = JSON.stringify(db); db = Object.assign(fresh(), d); save(); buildQueue();
      toast('バックアップから戻しました', '元に戻す', () => { db = JSON.parse(backup); save(); buildQueue(); });
    } catch (_) { toast('このファイルは読み込めませんでした'); }
  };

  const applyTheme = () => { if (db.theme) document.documentElement.dataset.theme = db.theme; else delete document.documentElement.dataset.theme; };
  $('themeBtn').onclick = () => { const dark = db.theme ? db.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; db.theme = dark ? 'light' : 'dark'; applyTheme(); save(); };
  applyTheme(); buildQueue();
  let shown = today();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== shown) { shown = today(); buildQueue(); } });
})();
</script>
</body>
</html>
